<!doctype html><html><head><meta charset="utf-8"><title>⏱ Focus mode</title><style>
body{margin:0;font:15px system-ui,Segoe UI,sans-serif;background:linear-gradient(135deg,#eef2ff,#f5f3ff);color:#1e1b4b;display:grid;place-items:center;min-height:100vh}
.c{background:#fff;border-radius:18px;box-shadow:0 18px 50px rgba(67,56,202,.15);padding:34px 40px;max-width:520px;text-align:center}
.e{font-size:44px}h1{margin:8px 0;font-size:22px;color:#4338ca}p{color:#4b5563;line-height:1.5}b#t{font-variant-numeric:tabular-nums;color:#4338ca}
button{margin-top:14px;font:inherit;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:#4338ca;color:#fff;font-weight:600}
</style></head><body><div class="c"><div class="e">🧘</div><h1>Focus mode is on</h1><p><span id="h"></span> is on your distraction list.<br>It opens again when this focus session ends in <b id="t"></b>.</p><button onclick="history.length>1?history.back():location.href='https://www.google.com/'">← Back to studying</button></div>
<script>const q=new URLSearchParams(location.search);document.getElementById('h').textContent=q.get('h')||'This site';const until=+q.get('until')||0;
function tick(){const s=Math.max(0,Math.round((until-Date.now())/1000));document.getElementById('t').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s<=0)location.reload()}tick();setInterval(tick,1000)</script></body></html>
