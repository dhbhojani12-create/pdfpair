<title>PaperPair</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Newsreader:opsz,wght@6..72,400..700&display=swap">
<style>
/* Layout: library of papers (folders left, cards right) → workspace: page strip | single page on a desk | pairs + inspector */
:root{
  /* Ink & Highlighter: ink-dark bars, highlighter yellow for what matters, cool grey ground, serif for question text */
  --bg:#EEF0F2; --panel:#FFFFFF; --raise:#F7F8F9; --sel:#FFF6C2; --ink:#12161F; --ink2:#1E2430; --ink3:#2E3646; --inkline:#3A4355; --muted:#5A6270; --faint:#646C7A; --line:#DDE1E6;
  --desk:#E2E5E9; --q:#2F6FDE; --q-soft:rgba(47,111,222,.09); --a:#17704C; --a-soft:rgba(23,112,76,.09); --hi:#FFE14D; --hi-soft:#FFF6C2;
  --star:#B08600; --star-soft:#FFF6C2; --warn:#A32020; --focus:#12161F; --shadow:0 16px 40px -20px rgba(18,22,31,.35);
  --ring:0 0 0 1px var(--line); --card:0 0 0 1px var(--line);
  --f-disp:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Geist","Segoe UI",system-ui,sans-serif;
  --f-mono:"Geist","Segoe UI",system-ui,sans-serif;
  --f-serif:"Newsreader",Georgia,"Times New Roman",serif;
  --c-afm:#5B8DEF; --c-audit:#F08A4B; --c-fr:#3DBE8B;
  color-scheme:light;
}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
.view{min-height:0;min-width:0}

/* top bar */
.top{display:flex;align-items:center;gap:12px;min-height:56px;box-sizing:border-box;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:700 19px/1 var(--f-disp);letter-spacing:-.01em;display:flex;align-items:center;gap:9px;white-space:nowrap}
.mk{display:inline-grid;grid-template-columns:1fr 1fr;gap:2px;width:20px;height:16px}.mk i{border-radius:2px;background:var(--q)}.mk i+i{background:var(--a)}
.docname{font-weight:600;min-width:0;max-width:34ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:3px}
.tab{border:0;background:none;padding:6px 14px;border-radius:7px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tab .ct{font:600 11px var(--f-mono);margin-left:6px;color:var(--faint)}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:9px;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s,transform .08s}
.btn:hover{background:var(--raise)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.primary:hover{opacity:.92;background:var(--ink)}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--raise)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.ib{display:grid;place-items:center;width:34px;height:34px;border:0;background:none;border-radius:8px;color:var(--muted);flex:none;transition:background .15s,color .15s}
.ib:hover{background:var(--raise);color:var(--ink)}
.ib:disabled{opacity:.35;cursor:default;background:none}
.ib.on{color:var(--star)}
.search{display:flex;align-items:center;gap:8px;background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:0 10px;height:36px;color:var(--muted);min-width:0;flex:0 1 260px}
.search input{border:0;background:none;outline:0;width:100%;min-width:0;color:var(--ink)}
.search:focus-within{border-color:var(--focus)}

/* library */
.lib{display:grid;grid-template-columns:236px 1fr;height:100%;min-height:0}
.folders{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px 10px 30px;display:flex;flex-direction:column;gap:2px}
.fsec{font:600 10.5px var(--f-mono);letter-spacing:0;text-transform:none;color:var(--faint);padding:16px 10px 6px;display:flex;justify-content:space-between;align-items:center}
.fsec:first-child{padding-top:4px}
.fsec button{border:0;background:none;color:var(--muted);padding:2px;border-radius:5px;display:grid}
.fsec button:hover{color:var(--ink);background:var(--raise)}
.fi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;width:100%;text-align:left;color:var(--ink);transition:background .12s}
.fi:hover{background:var(--raise)}
.fi.on{background:var(--sel);font-weight:600}
.fi .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .n{font:500 11.5px var(--f-mono);color:var(--faint)}
.fi .ic{color:var(--muted)}
.fdot{width:10px;height:10px;border-radius:3px;flex:none}
.fin{display:flex;gap:6px;padding:4px 6px}
.fin input{flex:1;min-width:0;border:1px solid var(--focus);border-radius:7px;padding:6px 8px;background:var(--panel);outline:0}
.libmain{overflow:auto;min-width:0;padding-block:26px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.lhead{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.lhead h1{font:700 26px/1.1 var(--f-disp);margin:0;letter-spacing:-.01em;text-wrap:balance}
.lhead .sub{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:18px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:transform .16s ease,box-shadow .16s ease,border-color .16s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:transparent}
.cthumb{display:block;border:0;padding:0;background:var(--desk);aspect-ratio:4/3;overflow:hidden;cursor:pointer;width:100%}
.cthumb img{width:86%;margin:10px auto 0;display:block;box-shadow:0 2px 8px rgba(0,0,0,.18);border-radius:2px;background:#fff}
.cthumb .ph{height:100%;display:grid;place-items:center;color:var(--faint);font:600 12px var(--f-mono)}
.cbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cname{border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink);word-break:break-word}
.cmeta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cmeta .st{color:var(--star);font-weight:600}
.pbar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:4px}.pbar i{display:block;height:100%;background:var(--a)}
.cmore{position:absolute;top:8px;right:8px;background:var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.15);opacity:0}
.card:hover .cmore,.cmore:focus-visible,.cmore[aria-expanded="true"]{opacity:1}
@media (hover:none){.cmore{opacity:1}}
.ftag{display:inline-flex;align-items:center;gap:5px}
.empty{border:2px dashed var(--line);border-radius:16px;padding:48px 24px;text-align:center;color:var(--muted);max-width:560px;margin:30px auto}
.empty strong{display:block;font:700 20px var(--f-disp);color:var(--ink);margin-bottom:6px}
.empty .btn{margin-top:14px}
.lrows{display:flex;flex-direction:column;gap:22px}
.lgrp h3{font:600 11px var(--f-mono);letter-spacing:0;text-transform:none;color:var(--faint);margin:0 0 8px;display:flex;gap:8px;align-items:center}
.lrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--panel);border-bottom:1px solid var(--line);padding:11px 14px;text-align:left;color:var(--ink)}
.lgrp .lbox{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lgrp .lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--raise)}
.lrow .nm{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .mt{font:500 12px var(--f-mono);color:var(--faint);white-space:nowrap}
.lrow .pc{font-size:12px;color:var(--a);white-space:nowrap}
.note{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--muted);font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}

.menu{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:210px;max-width:calc(100vw - 32px);max-height:70vh;overflow:auto}
.mi{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;border:0;background:none;border-radius:7px;text-align:left;color:var(--ink)}
.mi:hover{background:var(--raise)}
.mi.danger{color:var(--warn)}
.mi.cur{font-weight:600}
.mi .chk{margin-left:auto;color:var(--a)}
.msep{height:1px;background:var(--line);margin:5px 4px}
.mlab{font:600 10px var(--f-mono);letter-spacing:0;text-transform:none;color:var(--faint);padding:6px 10px 3px}
.menu input{width:100%;box-sizing:border-box;border:1px solid var(--focus);border-radius:7px;padding:7px 9px;background:var(--panel);outline:0}
.mrow{display:flex;gap:6px;padding:6px 4px 2px;justify-content:flex-end}
.mtext{padding:6px 10px;font-size:13px;color:var(--muted);max-width:260px}
.mtext.keys{line-height:2.1;color:var(--ink);max-width:300px}

/* workspace: mark */
.markv{display:grid;grid-template-columns:128px 1fr 300px;height:100%;min-height:0}
.thumbs{overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:14px 12px 40px;display:flex;flex-direction:column;gap:12px}
.th{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;width:100%}
.tc{width:100%;background:#fff;border-radius:3px;box-shadow:0 0 0 1px var(--line);overflow:hidden;display:block;position:relative;transition:box-shadow .12s}
.tc canvas{position:absolute;inset:0;width:100%;height:100%}
.th:hover .tc{box-shadow:0 0 0 1px var(--faint)}
.th.on .tc{box-shadow:0 0 0 2.5px var(--ink)}
.tn{font:500 11px var(--f-mono);color:var(--faint)}.th.on .tn{color:var(--ink);font-weight:600}
.tb{position:absolute;top:5px;right:5px;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.tb i{font:600 9.5px/1.5 var(--f-mono);font-style:normal;padding:0 4px;border-radius:3px;color:var(--panel)}
.tb .bq{background:var(--q)}.tb .ba{background:var(--a)}
.stagewrap{display:grid;grid-template-rows:auto auto 1fr;min-height:0;min-width:0;position:relative}
.stagewrap>.tools{grid-row:1}.stagewrap>.sbar{grid-row:2}.stagewrap>.stage{grid-row:3}
.sbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;background:color-mix(in srgb,var(--q) 9%,var(--panel));border-bottom:1px solid var(--line);font-size:13px}
.sbar .txt{flex:1;min-width:180px}.sbar .txt b{font-weight:600}.sbar .w{color:var(--warn)}
.sbar .btn{padding:5px 11px;font-size:12.5px}.sbar .btn:focus:not(:focus-visible){outline:none}
.sbar .sgpos{font:600 12px var(--f-mono);color:var(--muted);padding:0 2px}
.sug.focus{outline:3px solid var(--focus);outline-offset:2px;z-index:3}
.sug{position:absolute;border:2px dashed currentColor;color:var(--q);border-radius:3px;pointer-events:none;box-sizing:border-box;background:repeating-linear-gradient(135deg,transparent 0 9px,color-mix(in srgb,currentColor 8%,transparent) 9px 18px)}
.sug.a{color:var(--a)}
.sghint{font-size:12px;color:var(--muted);margin-left:auto;margin-right:6px;white-space:nowrap}@media (max-width:1300px){.sghint{display:none}}
.sug{pointer-events:auto;cursor:pointer}.sug.ssel{cursor:move;border-style:solid;z-index:4}.sug .h{pointer-events:auto}
.sug .lab{pointer-events:auto;display:flex;align-items:center;gap:5px}
.sug.chk{color:#C2410C!important;border-width:3px}
.res.diag span{display:block;margin-top:6px;line-height:1.45}.res.diag .dtips{display:flex;flex-wrap:wrap;gap:6px}.res.diag .dtips .btn{height:32px;font-size:13px}
.kwf{display:grid;gap:4px;margin:6px 0;font-size:13px;color:var(--muted)}.kwf input{height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:500 14px var(--f-body);color:var(--ink);background:#fff}
.kwf input:focus{outline:2px solid var(--hi);border-color:var(--ink)}
.kwrec{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.kwh{flex:1 0 100%;font-size:12px;color:var(--muted)}
.kwchip{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1px;max-width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 28px 6px 10px;font:500 13px var(--f-body);color:var(--ink);cursor:pointer;text-align:left}
.kwchip b{font-weight:600}.kwchip span{font-size:11.5px;color:var(--muted)}.kwchip.best{border-color:#E0B400;background:#FFF9DB}
.kwchip i{position:absolute;right:6px;top:5px;font-style:normal;color:var(--faint);font-size:15px;padding:0 4px}.kwchip i:hover{color:var(--ink)}
.chkbtn{background:#FFF4E5!important;color:#9A3412!important;border:1px solid #F5C08A!important;box-shadow:none!important;font-weight:600;white-space:nowrap}
.chkbtn:hover{background:#FFE7CC!important}
.pi.chk{box-shadow:inset 3px 0 0 #F59E0B}
.pi.chk .pj{flex-wrap:wrap;row-gap:2px}.pi .chkr{flex:1 0 100%;display:block;font-size:11.5px;line-height:1.35;color:#9A3412;margin-top:2px;white-space:normal}
.pi .okc{color:#15803D;font-weight:700}
.sugx{border:0;background:none;padding:0 1px;font:700 13px/1 var(--f-body);cursor:pointer;color:var(--panel);opacity:.85}
.sugx:hover{opacity:1}
.tb .bs{background:var(--faint)}
.logta{width:100%;box-sizing:border-box;height:52vh;font:11.5px/1.45 var(--f-mono);border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--raise);color:var(--ink);white-space:pre;overflow:auto;resize:vertical}
.exl{display:flex;flex-direction:column;gap:6px;max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.learned{display:flex;flex-direction:column;gap:5px;font-size:13px}
.learned code{font:600 12.5px var(--f-mono);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.tools{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--raise)}
.seg button{border:0;background:none;padding:6px 12px;display:flex;align-items:center;gap:7px;font-weight:500;color:var(--muted);transition:background .12s,color .12s}
.seg button+button{border-left:1px solid var(--line)}
.seg button kbd{font:600 10px var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--faint);background:var(--panel)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink)}
.seg .mq[aria-pressed="true"]{color:var(--q);box-shadow:inset 0 -2px 0 var(--q)}
.seg .ma[aria-pressed="true"]{color:var(--a);box-shadow:inset 0 -2px 0 var(--a)}
.seg .mv[aria-pressed="true"]{box-shadow:inset 0 -2px 0 var(--ink)}
.dot{width:9px;height:9px;border-radius:2px;border:2px solid currentColor}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tog{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.tog input{accent-color:var(--q)}
.hint{flex:1 1 220px;min-width:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.hint b{color:var(--ink);font-weight:600}
.stage{overflow:auto;background:var(--desk);min-height:0;position:relative;overscroll-behavior:contain}
.cbox{display:grid;place-items:center;min-width:100%;min-height:100%;width:max-content;height:max-content;padding:24px 24px 96px;box-sizing:border-box}
.page{position:relative;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18),0 8px 24px rgba(0,0,0,.10)}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;touch-action:none}
.stage.m-q .ov,.stage.m-a .ov{cursor:crosshair}
.pnav{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:5px;z-index:4;white-space:nowrap;max-width:calc(100% - 24px);overflow-x:auto}
.pnav .pin{width:46px;text-align:center;border:1px solid var(--line);border-radius:7px;padding:5px 2px;background:var(--raise);font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.pnav .of{font:500 13px var(--f-mono);color:var(--muted);padding:0 6px 0 4px;font-variant-numeric:tabular-nums}
.pnav .zv{font:500 12.5px var(--f-mono);min-width:48px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.pnav .sep{width:1px;height:22px;background:var(--line);margin:0 5px;flex:none}
.pnav .ib[aria-pressed="true"]{background:var(--sel);color:var(--ink)}
.jump{border:0;border-radius:9px;padding:6px 10px;font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px}
.jump.q{background:var(--q-soft);color:var(--q)}.jump.a{background:var(--a-soft);color:var(--a)}

.reg{position:absolute;color:var(--q);border:2px solid currentColor;background:var(--q-soft);border-radius:2px;cursor:move;touch-action:none;box-sizing:border-box;transition:opacity .12s}
.reg.a{color:var(--a);background:var(--a-soft)}
.reg:not(.act){opacity:.55}
.reg.act{box-shadow:0 0 0 3px color-mix(in srgb,currentColor 20%,transparent);opacity:1}
.reg.sel{opacity:1;background:color-mix(in srgb,currentColor 16%,transparent)}
.reg.drawing{border-style:dashed;opacity:1;pointer-events:none}
.lab{position:absolute;left:-2px;top:-2px;transform:translateY(-100%);background:currentColor;border-radius:4px 4px 4px 0;padding:1px 7px;font:600 11px/1.55 var(--f-mono);white-space:nowrap;pointer-events:none}
.lab span{color:var(--panel)}
.h{position:absolute;width:12px;height:12px;background:#fff;border:2px solid currentColor;border-radius:3px;box-sizing:border-box}
.h::after{content:"";position:absolute;inset:-9px}
.h[data-h="nw"]{left:-7px;top:-7px;cursor:nwse-resize}.h[data-h="se"]{right:-7px;bottom:-7px;cursor:nwse-resize}
.h[data-h="ne"]{right:-7px;top:-7px;cursor:nesw-resize}.h[data-h="sw"]{left:-7px;bottom:-7px;cursor:nesw-resize}
.h[data-h="n"]{left:calc(50% - 6px);top:-7px;cursor:ns-resize}.h[data-h="s"]{left:calc(50% - 6px);bottom:-7px;cursor:ns-resize}
.h[data-h="e"]{right:-7px;top:calc(50% - 6px);cursor:ew-resize}.h[data-h="w"]{left:-7px;top:calc(50% - 6px);cursor:ew-resize}
.size{position:absolute;right:0;bottom:-2px;transform:translateY(100%);font:500 10px var(--f-mono);background:var(--ink);color:var(--panel);padding:1px 5px;border-radius:0 0 3px 3px;pointer-events:none;white-space:nowrap}

.panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ph2{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px}
.ph2 h2{margin:0;font:600 10.5px var(--f-mono);letter-spacing:0;text-transform:none;color:var(--faint)}
.ph2 .n{font:600 12px var(--f-mono);color:var(--muted)}
.plist{flex:1;overflow:auto;padding:0 8px 12px;display:flex;flex-direction:column;gap:2px;min-height:80px}
.pi{display:flex;align-items:center;border-radius:9px;border:1px solid transparent;transition:background .12s}

<div class="modal" id="exModal" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="exTitle">
    <h3 id="exTitle">Export side-by-side PDF</h3>
    <p class="sub">Question on the left, answer on the right.</p>
    <fieldset>
      <legend>Layout</legend>
      <label class="opt"><input type="radio" name="exLay" id="exCont" value="cont" checked><span><b>Continuous long pages</b><small>All pairs on tall pages you scroll through.</small></span></label>
      <label class="opt"><input type="radio" name="exLay" id="exSlide" value="slide"><span><b>One question per page</b><small>Landscape pages, each pair enlarged.</small></span></label>
    </fieldset>
    <fieldset>
      <legend>Questions</legend>
      <div class="row2">
        <label class="opt"><input type="radio" name="exWhich" id="exAll" value="all" checked><span><b id="exAllL">All</b></span></label>
        <label class="opt"><input type="radio" name="exWhich" id="exImp" value="imp"><span><b id="exImpL">★ Important only</b></span></label>
      </div>
      <div id="exChWrap" hidden><div class="lbl" style="margin:4px 0 6px">Chapters</div><div class="chlist" id="exChs"></div></div>
      <label class="chk"><input type="checkbox" id="exMarks" checked> Include highlights and pen marks</label>
      <label class="chk"><input type="checkbox" id="exNotes" checked> Include notes and tags</label>
      <label class="chk"><input type="checkbox" id="exHi"> High quality (sharper, larger file)</label>
    </fieldset>
    <div class="foot">
      <div class="prog" id="exProg" hidden><span id="exMsg"></span><div class="bar2"><i id="exBar"></i></div></div>
      <button class="btn" id="exCancel">Close</button>
      <button class="btn primary" id="exGo">Export PDF</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
const SAMPLE_B64="__SAMPLE__";
const SAMPLE_REGIONS=__REGIONS__;
const SAMPLE_NAME="Motion – practice set B (sample).pdf";
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* ================= utils ================= */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r4=v=>Math.round(v*10000)/10000;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const frame=()=>new Promise(requestAnimationFrame);
const COLORS={yellow:"#ffd60a",green:"#52d36a",pink:"#ff6fb5",blue:"#4fb0ff",pen:"#d4262a"};
const FCOLORS=["#3157d0","#0d855c","#c2410c","#9333ea","#0891b2","#be185d","#4d7c0f","#a16207"];
const IC={more:'<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
  file:'<path d="M14 3H6a1 1 0 00-1 1v16a1 1 0 001 1h12a1 1 0 001-1V8z"/><path d="M14 3v5h5"/>',plus:'<path d="M12 5v14M5 12h14"/>',
  all:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  inbox:'<path d="M4 13l2.5-7h11L20 13v6H4z"/><path d="M4 13h4.5a3.5 3.5 0 007 0H20"/>',refresh:'<path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 4v7h-7"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',star:'<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/>',
  snap:'<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><rect x="8" y="8" width="8" height="8" rx="1"/>',
  up:'<path d="M6 15l6-6 6 6"/>',down:'<path d="M6 9l6 6 6-6"/>',prev:'<path d="M15 18l-6-6 6-6"/>',next:'<path d="M9 6l6 6-6 6"/>',
  link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',check:'<path d="M5 12l5 5 9-10"/>'};
const ic=(n,c="")=>'<svg class="ic '+c+'" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>';
function ago(t){if(!t)return"";const s=(Date.now()-t)/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" h ago";const d=Math.floor(s/86400);return d===1?"yesterday":d<30?d+" days ago":new Date(t).toLocaleDateString()}
const fsize=b=>b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
let toastT=0;
function toast(msg,undoFn){const t=$("#toast");t.innerHTML="<span>"+esc(msg)+"</span>"+(undoFn?'<button id="tUndo">Undo</button>':"");t.hidden=false;
  if(undoFn)$("#tUndo").onclick=()=>{undoFn();t.hidden=true};clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4000)}

/* ================= storage (IndexedDB with in-memory fallback) ================= */
const DB={db:null,mem:{},ok:true,
  async open(){if(this.db||!this.ok)return this.db;try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open("paperpair",3);
      r.onupgradeneeded=()=>{const d=r.result;["f","docs","bytes","marks","kv","handles","text"].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("blocked"))})}catch(e){this.ok=false;this.db=null}return this.db},
  m(s){return this.mem[s]||(this.mem[s]=new Map())},
  async tx(s,mode,fn){const db=await this.open();if(!db)return null;return new Promise((res,rej)=>{let out;try{const t=db.transaction(s,mode);out=fn(t.objectStore(s));t.oncomplete=()=>res(out&&"result"in out?out.result:out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}catch(e){rej(e)}})},
  async get(s,k){try{if(!(await this.open()))return this.m(s).get(k);return await this.tx(s,"readonly",st=>st.get(k))}catch(e){return this.m(s).get(k)}},
  async put(s,k,v){try{if(!(await this.open())){this.m(s).set(k,v);return}await this.tx(s,"readwrite",st=>{st.put(v,k)});if(s==="marks"||s==="kv"||s==="docs")try{PPCH&&PPCH.postMessage({t:s,key:k})}catch(_){}}catch(e){this.m(s).set(k,v);console.warn("save failed",e);if(!this.warned){this.warned=true;toast(e&&e.name==="QuotaExceededError"?"Storage is full, so your last changes are NOT saved. Delete some papers, then click Backup.":"Your browser refused to save. Your changes are only in this tab: click Backup now so nothing is lost.")}}},
  async del(s,k){try{if(!(await this.open())){this.m(s).delete(k);return}await this.tx(s,"readwrite",st=>{st.delete(k)});if(s==="docs")try{PPCH&&PPCH.postMessage({t:"docs",key:k,gone:true})}catch(_){}}catch(e){this.m(s).delete(k)}},
  async entries(s){try{if(!(await this.open()))return[...this.m(s).entries()];const db=this.db;return await new Promise((res,rej)=>{const out=[];const t=db.transaction(s);const c=t.objectStore(s).openCursor();
      c.onsuccess=()=>{const cu=c.result;if(cu){out.push([cu.key,cu.value]);cu.continue()}else res(out)};c.onerror=()=>rej(c.error)})}catch(e){return[...this.m(s).entries()]}}
};

// writes waiting on a short timer: all finished at once when the tab is hidden or closed
const PEND=new Map();function flushPending(){for(const f of [...PEND.values()])try{f()}catch(_){}}
addEventListener("pagehide",flushPending);document.addEventListener("visibilitychange",()=>{if(document.hidden)flushPending()});
// tabs talk to each other: when one tab saves a paper, the others pick up the new version (so an old copy never overwrites it)
const PPCH=(()=>{try{return new BroadcastChannel("paperpair")}catch(_){return null}})();
/* ================= state ================= */
const S={view:"lib",tab:"mark",doc:null,pdf:null,pages:[],cur:1,zoom:1,fit:"page",mode:"q",auto:true,extend:false,
  activeId:null,selId:null,data:{pairs:[],marks:{}},hist:[],future:[],reviewDirty:true,last:{q:0,a:0},
  hl:null,hlSize:.025,straight:true,hideAns:false,onlyStar:false,rc:0,revealed:false,rfit:"width",list:[]};
const L={docs:[],folders:[],meta:new Map(),links:[],filter:"all",q:"",menu:null,newFolder:false};

/* ================= library ================= */
const docKey=(name,size)=>name+"|"+size;
function metaOf(d){const p=d&&d.pairs||[];return{chapters:(d&&d.chapters||[]).length,count:p.length,stars:p.filter(x=>x.star).length,ldr:p.filter(x=>x.ldr).length,mis:p.filter(x=>x.mis).length,answered:p.filter(x=>x.a.length&&x.q.length).length}}
// earlier copies kept when a paper suddenly lost questions (see putMarks)
async function restorePrev(d){const pv=await DB.get("kv","prev:"+d.key);if(!pv||!pv.data){toast("No earlier copy of this paper");return}const cur=await DB.get("marks",d.key);const nNow=cur&&cur.data&&cur.data.pairs?cur.data.pairs.length:0;
  gm("Bring back earlier marks?",'<p style="margin:0">An earlier copy of <b>'+esc(d.name.replace(/\.pdf$/i,""))+'</b> from '+new Date(pv.at).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+' has <b>'+pv.n+'</b> questions. It has <b>'+nNow+'</b> now.</p><p style="color:var(--muted);font-size:13.5px">The current marks are kept as the new earlier copy, so you can switch back.</p>',
    [{label:"Cancel",onClick:gmClose},{label:"Bring back "+pv.n+" questions",primary:true,onClick:async()=>{gmClose();if(cur&&cur.data)await DB.put("kv","prev:"+d.key,{data:cur.data,page:cur.page,at:Date.now(),n:nNow});await DB.put("marks",d.key,{data:pv.data,page:pv.page||1,updated:Date.now()});await loadLibrary();renderLibrary();toast("Brought back "+pv.n+" questions")}}])}
async function loadLibrary(){
  L.docs=(await DB.entries("docs")).map(e=>e[1]).filter(Boolean);
  L.folders=(await DB.get("kv","folders"))||[];
  try{L.prevKeys=new Set((await DB.entries("kv")).map(e=>e[0]).filter(k=>typeof k==="string"&&k.startsWith("prev:")).map(k=>k.slice(5)))}catch(_){L.prevKeys=new Set()}
  const mk=await DB.entries("marks");L.marksData=new Map(mk);
  L.meta=new Map(mk.map(([k,v])=>[k,{...metaOf(v&&v.data),updated:v&&v.updated,page:v&&v.page}]));
  L.texts=new Map(await DB.entries("text"));L.sources=(await DB.get("kv","sources"))||{};L.lastBackup=await DB.get("kv","lastBackup");try{L.repStats=L.repStats||(await DB.get("kv","repStats"))}catch(_){}
  try{L.plans=L.plans||(await DB.get("kv","plans"))||{};L.seen=L.seen||(await DB.get("kv","seen"))||{}}catch(_){L.plans=L.plans||{};L.seen=L.seen||{}}
  try{L.srs=L.srs||(await DB.get("kv","srs"))||{};L.skip=L.skip||(await DB.get("kv","skip"))||{};L.exams=L.exams||(await DB.get("kv","exams"))||{dates:{},finish:14}}catch(_){L.srs=L.srs||{};L.skip=L.skip||{};L.exams=L.exams||{dates:{},finish:14}}
  const hs=await DB.entries("handles");
  L.links=hs.map(([id,v])=>{const old=L.links.find(l=>l.id===id);return old||{id,name:v.name,handle:v.handle,files:null,state:"unknown"}});
  if(L.filter.startsWith("f:")&&!L.folders.some(f=>"f:"+f.id===L.filter))L.filter="all";
  if(L.filter.startsWith("link:")&&!L.links.some(l=>"link:"+l.id===L.filter))L.filter="all";
  renderLibrary();
}
function renderLibrary(){renderFolders();renderLibMain()}
function renderFolders(){
  const n=L.docs.length,uns=L.docs.filter(d=>!d.folder||!L.folders.some(f=>f.id===d.folder)).length;
  let h='<div class="fsec">Library</div>'+
    '<button class="fi" id="openBank">'+ic("star")+'<span class="nm">Question Bank</span><span class="n">'+[...L.meta.values()].reduce((s,m)=>s+(m.count||0),0)+'</span></button>'+
    fi("all",ic("all"),"All papers",n)+fi("unsorted",ic("inbox"),"Unsorted",uns)+
    '<div class="fsec">Subjects<button id="addFolder" title="New subject folder" aria-label="New subject folder">'+ic("plus")+'</button></div>';
  for(const f of L.folders)h+=fi("f:"+f.id,'<span class="fdot" style="background:'+f.color+'"></span>',f.name,L.docs.filter(d=>d.folder===f.id).length,f.id);
  if(L.newFolder)h+='<div class="fin"><input id="nfIn" placeholder="Subject name" maxlength="40"><button class="btn primary" id="nfOk">Add</button></div>';
  else if(!L.folders.length)h+='<button class="fi" id="addFolder2">'+ic("plus")+'<span class="nm" style="color:var(--muted)">New subject</span></button>';
  h+='<div class="fsec">On this computer'+(fsSupported()?'<button id="addLink" title="Link a folder" aria-label="Link a folder">'+ic("plus")+'</button>':"")+'</div>';
  for(const l of L.links)h+=fi("link:"+l.id,ic("link"),l.name,l.files?l.files.length:"",null);
  if(!L.links.length)h+='<button class="fi" id="addLink2">'+ic("folder")+'<span class="nm" style="color:var(--muted)">Link a folder</span></button>';
  const anyMarks=[...L.meta.values()].some(m=>m.count);
  h+='<div class="fsec">Backup</div><div class="bk"><button class="btn" id="bkBtn" title="Save all papers and marks into one file">Back up</button><label class="btn" for="bkIn" title="Bring papers and marks back from a backup file">Restore</label></div>'+
    '<div class="bkt'+(!L.lastBackup&&anyMarks||(L.lastBackup&&Date.now()-L.lastBackup>14*864e5)?" warn":"")+'">'+(L.lastBackup?"Last backup "+ago(L.lastBackup):"Not backed up yet")+'</div>';
  $("#folders").innerHTML=h;
  const nf=$("#nfIn");if(nf){nf.focus();nf.onkeydown=e=>{if(e.key==="Enter")addFolder(nf.value);if(e.key==="Escape"){L.newFolder=false;renderFolders()}};$("#nfOk").onclick=()=>addFolder(nf.value)}
}
function fi(id,icon,name,n,fid){return'<button class="fi'+(L.filter===id?" on":"")+'" data-f="'+id+'"'+(fid?' data-fid="'+fid+'"':"")+'>'+icon+'<span class="nm">'+esc(name)+'</span><span class="n">'+n+'</span></button>'}
async function addFolder(name){name=(name||"").trim();if(!name){L.newFolder=false;renderFolders();return}
  const f={id:uid(),name,color:FCOLORS[L.folders.length%FCOLORS.length]};L.folders.push(f);await DB.put("kv","folders",L.folders);L.newFolder=false;L.filter="f:"+f.id;renderLibrary()}
$("#folders").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="addFolder"||b.id==="addFolder2"){L.newFolder=true;renderFolders();return}
  if(b.id==="addLink"||b.id==="addLink2"){linkFolder();return}
  if(b.id==="bkBtn"){backupLibrary();return}
  if(b.id==="openBank"){openBank();return}
  if(b.dataset.f){L.filter=b.dataset.f;renderLibrary();const l=curLink();if(l&&!l.files)scanLink(l)}
});
$("#folders").addEventListener("contextmenu",e=>{const b=e.target.closest("[data-fid]");if(!b)return;e.preventDefault();folderMenu(b,b.dataset.fid)});
function curLink(){return L.filter.startsWith("link:")?L.links.find(l=>"link:"+l.id===L.filter):null}
function filteredDocs(){
  let ds=L.docs.slice();
  if(L.filter==="unsorted")ds=ds.filter(d=>!d.folder||!L.folders.some(f=>f.id===d.folder));
  else if(L.filter.startsWith("f:"))ds=ds.filter(d=>"f:"+d.folder===L.filter);
  if(L.q)ds=ds.filter(d=>d.name.toLowerCase().includes(L.q));
  return ds.sort((a,b)=>(b.opened||b.added||0)-(a.opened||a.added||0));
}
/* ---------- Today: headline, timer, plan, question bank at a glance, all PDFs ---------- */
const SUBC={afm:"var(--c-afm)",audit:"var(--c-audit)",fr:"var(--c-fr)"};
function subColor(f){if(!f)return"#9AA3B2";return SUBC[(f.name||"").trim().toLowerCase()]||f.color||"#9AA3B2"}
/* ---- exam countdown, pace, LDR-first, due, topic coverage (Today) ---- */
function subStats(){const m=new Map();const seen=L.seen||{},skip=L.skip||{};
  for(const d of L.docs){const md=L.marksData&&L.marksData.get(d.key);const ps=md&&md.data&&md.data.pairs;if(!ps||!ps.length)continue;const fo=L.folders.find(x=>x.id===d.folder);const id=fo?fo.id:"none";
    if(!m.has(id))m.set(id,{id,name:fo?fo.name:"Unsorted",color:fo?subColor(fo):"#9AA3B2",tot:0,done:0,ldr:[],topics:new Map()});const s=m.get(id);
    for(const p of ps){const k=d.key+"|"+p.id,dn=!!(seen[k]||skip[k]);s.tot++;if(dn)s.done++;if(p.ldr)s.ldr.push(k);const tg=(p.tags&&p.tags.length?p.tags:["Untagged"]);for(const t2 of tg){if(!s.topics.has(t2))s.topics.set(t2,{n:0,d:0});const r=s.topics.get(t2);r.n++;if(dn)r.d++}}}
  return m}
function daysTo(dstr){if(!dstr)return null;const d=new Date(dstr+"T00:00:00");if(isNaN(d))return null;return Math.round((d.getTime()-dayStart())/DAY)}
function examCardsHTML(){const ex=L.exams||{dates:{}},ss=subStats();const set=[...ss.values()].filter(s=>ex.dates&&ex.dates[s.id]&&daysTo(ex.dates[s.id])>=0).sort((a,b)=>daysTo(ex.dates[a.id])-daysTo(ex.dates[b.id]));
  if(!set.length)return'<button class="btn texset" data-act="exams"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Set exam dates</button>';
  return'<div class="texams">'+set.map(s=>{const dl=daysTo(ex.dates[s.id]),fin=ex.finish||14,left=s.tot-s.done,work=dl-fin;const dt=new Date(ex.dates[s.id]+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});
    const pace=dl<=1?"LDR time":work>0?(left?Math.ceil(left/work)+" a day to finish":"bank finished"):"revision days";
    return'<button class="texc'+(dl<=1?" now":"")+'" data-act="exams" title="'+esc(s.name)+': '+left+' questions left to revise"><span><i style="background:'+s.color+'"></i>'+esc(s.name)+' · '+dt+'</span><b>'+(dl===0?"Today":dl===1?"Tomorrow":dl+" days")+'</b><small>'+pace+'</small></button>'}).join("")+'<button class="texe" data-act="exams" aria-label="Edit exam dates">✎</button></div>'}
function ldrBannerHTML(){const ex=L.exams||{dates:{}},ss=subStats();const s=[...ss.values()].find(x=>{const d=daysTo(ex.dates&&ex.dates[x.id]);return d!=null&&d>=0&&d<=1});if(!s)return"";const d=daysTo(ex.dates[s.id]);
  return'<section class="tldr"><div><b>'+esc(s.name)+' exam '+(d===0?"today":"tomorrow")+'</b><span>'+(s.ldr.length?"Skim your "+s.ldr.length+" LDR questions first.":"You haven’t marked any LDR questions for "+esc(s.name)+". Use ★ Important instead.")+'</span></div>'+(s.ldr.length?'<button class="btn hi" data-act="ldrgo" data-sub="'+esc(s.id)+'">▶ Start LDR</button>':'')+'</section>'}
function examDialog(){const ex=L.exams||{dates:{},finish:14};const ss=[...subStats().values()].filter(s=>s.id!=="none");const subs=ss.length?ss:L.folders.map(f=>({id:f.id,name:f.name,color:subColor(f)}));
  gm("Your exam dates",'<p class="smp">Today counts down to each paper and works out how many questions a day you need. From 1.5 days before a paper, its LDR list comes first.</p>'+
    subs.map(s=>'<label class="exrow"><span><i style="background:'+s.color+'"></i>'+esc(s.name)+'</span><input type="date" data-exd="'+esc(s.id)+'" value="'+esc((ex.dates||{})[s.id]||"")+'"></label>').join("")+
    '<div class="exfin"><span>Finish the bank</span><div class="seg full" role="group">'+[7,14,21].map(n=>'<button data-exf="'+n+'" aria-pressed="'+((ex.finish||14)===n)+'">'+n+' days before</button>').join("")+'</div></div>',
    [{label:"Cancel",onClick:gmClose},{label:"Save dates",primary:true,onClick:async()=>{const dates={};document.querySelectorAll("#gBody [data-exd]").forEach(i=>{if(i.value)dates[i.dataset.exd]=i.value});const f=+((document.querySelector('#gBody [data-exf][aria-pressed="true"]')||{}).dataset||{}).exf||14;

async function makeThumb(doc){try{const pg=await doc.getPage(1);const v=pg.getViewport({scale:1});const sc=260/v.width;const vp=pg.getViewport({scale:sc});
  const c=document.createElement("canvas");c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
  await pg.render({canvasContext:x,viewport:vp}).promise;return c.toDataURL("image/jpeg",.78)}catch(e){return null}}
async function importFiles(files,openSingle=true){
  const pdfs=[...files].filter(f=>/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name));
  if(!pdfs.length){toast("Only PDF files can be added");return}
  const folder=L.filter.startsWith("f:")?L.filter.slice(2):null;let lastKey=null,added=0,bad=0,dup=0;
  $("#busy").hidden=false;
  try{for(const f of pdfs){
    $("#busy").textContent="Adding "+f.name+"…";
    const key=docKey(f.name,f.size);lastKey=key;
    if(L.docs.some(d=>d.key===key)){dup++;continue}
    const buf=await f.arrayBuffer();let thumb=null,pages=0;
    try{const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;pages=doc.numPages;thumb=await makeThumb(doc);closePdf(doc)}
    catch(e){(e&&e.closed||console.error(e));bad++;lastKey=null;if(pdfs.length===1)toast("“"+f.name+"” could not be read. It may be damaged or password-protected.");continue}
    await DB.put("bytes",key,buf);
    const rec={key,name:f.name,size:f.size,folder,added:Date.now(),opened:0,thumb,pages};await DB.put("docs",key,rec);added++;
  }}finally{$("#busy").hidden=true;$("#busy").textContent="Opening…"}
  await loadLibrary();
  if(openSingle&&pdfs.length===1&&lastKey){const d=L.docs.find(x=>x.key===lastKey);if(d)openDoc({kind:"lib",key:d.key,name:d.name,size:d.size});return}
  if(pdfs.length===1&&bad)return;
  const parts=[];if(added)parts.push("Added "+added+(added===1?" paper":" papers"));if(dup)parts.push(dup+(dup===1?" was":" were")+" already in your library");if(bad)parts.push(bad+" couldn't be read (damaged or password-protected)");toast(parts.join(" · ")||"Nothing added");
}

async function scanLink(l,force){
  if(!l||(l.scanning))return;
  try{const p=await l.handle.queryPermission({mode:"read"});if(p!=="granted"){l.state="prompt";renderLibrary();return}}catch(e){l.state="error";renderLibrary();return}
  l.state="granted";l.scanning=true;if(force)l.files=null;renderLibMain();
  const files=[];
  async function walk(dir,path,depth){for await(const [name,h] of dir.entries()){
    if(h.kind==="file"&&/\.pdf$/i.test(name)){try{const f=await h.getFile();files.push({name,path,handle:h,size:f.size,mod:f.lastModified})}catch(e){}}
    else if(h.kind==="directory"&&depth<4&&!name.startsWith("."))await walk(h,path?path+" / "+name:name,depth+1)}}
  try{await walk(l.handle,"",0)}catch(e){l.state="error"}
  l.files=files.sort((a,b)=>a.path.localeCompare(b.path)||a.name.localeCompare(b.name,undefined,{numeric:true}));l.scanning=false;renderLibrary();
}

/* ---- X-ray: what the PDF reader extracted from each page, and what Find did with every line ---- */
let xrDoc=null;
const xrPc=x=>Math.round(x*100)+"%",XR_NUM=/^\s*(?:(?:q(?:uestion)?|ex(?:ample)?|illustration)\s*\.?\s*(?:no\.?\s*)?)?\(?(\d{1,3})\s*[.):]\s*\S|^\s*(?:question|q)\s*\.?\s*(?:no\.?\s*)?(\d{1,3})\s*$/i;
async function xrayRead(force){const key=S.doc&&S.doc.key;if(!key)return null;if(xrDoc&&xrDoc.key===key&&!force)return xrDoc;
  const N=S.pages.length,pages=[];for(let n=1;n<=N;n++)pages.push(n);
  const D={key,N,P:null,res:null,ctx:null,items:new Map(),running:true};xrDoc=D;
  try{D.P=await readPages(pages,null,true);const keepRec=S.suggRecipe,bak=FIND_ORPH;FIND_ORPH=[];globalThis.XCTX=null;
    try{D.res=await runAuto(1,N,0,0,()=>{},{mcq:true,scen:true});D.ctx=D.res&&D.res.via&&/ICAI/.test(D.res.via)?(globalThis.XCTX||null):null}finally{S.suggRecipe=keepRec;FIND_ORPH=bak}}
  catch(e){D.err=e.message||String(e)}
  D.running=false;return D}
function xrayBuild(D,n){let it=D.items.get(n);if(it)return it;it=[];const pp=D.P&&D.P.get(n);if(!pp){D.items.set(n,it);return it}
  const inC=new Set(pp.content),pairs=(D.res&&D.res.pairs)||[],boxes=[];
  pairs.forEach(p=>["q","a"].forEach(side=>(p[side]||[]).forEach((b,j)=>{if(b.page===n)boxes.push({b,side,p,j})})));
  const col=D.ctx&&D.ctx.colX,ph=(S.pages[n-1]&&S.pages[n-1].h)||800,right=Math.max(...pp.content.map(c=>c.x1),.5);
  const inBox=(l,x)=>l.y0>=x.b.y-.006&&l.y1<=x.b.y+x.b.h+.008;
  boxes.forEach(x=>{x.start=pp.lines.filter(l=>l.y0>=x.b.y-.006&&inC.has(l)).sort((a,b2)=>a.y0-b2.y0)[0]||null});
  const lab=x=>(x.side==="q"?"Q":"A")+(x.p.label!=null?x.p.label:x.p.num!=null?x.p.num:"?");
  for(const l of pp.lines){const t=l.text.trim();if(!t)continue;
    const base={l,n,right,bottom:pp.bottom,font:(l.items&&l.items[0]&&l.items[0].f)||"",bold:isBold(l),pt:Math.round(l.h*ph*10)/10};
    if(!inC.has(l)){it.push({...base,k:"ignored",why:"A repeated header, footer or page number. Find skips these."});continue}
    const hit=boxes.find(x=>inBox(l,x));
    if(hit){const st=hit.start===l,first=hit.j===0;
      if(st&&first)it.push({...base,k:hit.side==="q"?"qstart":"astart",label:lab(hit),why:"Find started "+(hit.side==="q"?"question ":"the answer to question ")+(hit.p.label!=null?hit.p.label:hit.p.num)+" here."});
      else if(st)it.push({...base,k:hit.side==="q"?"qin":"ain",label:lab(hit)+" cont.",why:"Find continued "+lab(hit)+" here from the previous page."});
      else it.push({...base,k:hit.side==="q"?"qin":"ain",why:"Inside "+lab(hit)+": Find included this line in that box."});
      continue}
    if(XR_NUM.test(t)||SUBRE.test(t)){let why;const off=col!=null&&Math.abs(l.x0-col)>.013;
      if(off)why="Looks like a question number or part, but it starts "+xrPc(l.x0)+" from the left. Find expects question numbers at "+xrPc(col)+", so it did not use it.";
      else if(D.res&&D.res.pairs&&D.res.pairs.length)why="Looks like a question number or part, but Find did not use it. It may be a list item, or its number does not follow the last question.";

  if(!name){f.err="Give the chapter a name.";f.name=name;renderList();return}
  if(!(start>=1&&start<=S.pages.length)){f.err="Choose a page from 1 to "+S.pages.length+".";f.name=name;renderList();return}
  const clash=(S.data.chapters||[]).find(c=>c.start===start&&c.id!==f.id);
  if(clash){f.err="“"+clash.name+"” already starts on page "+start+". Pick another page.";f.name=name;renderList();return}
  pushHist();if(!S.data.chapters)S.data.chapters=[];
  if(f.id){const c=S.data.chapters.find(x=>x.id===f.id);c.name=name;c.start=start}else S.data.chapters.push({id:uid(),name,start});
  S.chForm=null;save();refreshAll();toast(f.id?"Chapter updated":"Chapter “"+name+"” starts on page "+start,undo);
}
function deleteChapter(id){const c=(S.data.chapters||[]).find(x=>x.id===id);if(!c)return;pushHist();S.data.chapters=S.data.chapters.filter(x=>x!==c);save();refreshAll();toast("Removed chapter “"+c.name+"”. Its questions joined the chapter before it.",undo)}

const pageCache=new Map();
function pageBitmap(n){
  if(pageCache.has(n)){const v=pageCache.get(n);pageCache.delete(n);pageCache.set(n,v);return v}
  const pr=(async()=>{const p=pageOf(n);const vp=p.pg.getViewport({scale:3});const c=document.createElement("canvas");c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);
    await p.pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;return c})();
  pr.catch(()=>pageCache.delete(n));pageCache.set(n,pr);while(pageCache.size>8)pageCache.delete(pageCache.keys().next().value);return pr;
}

function cropEl(r){const d=document.createElement("div");d.className="crop";d.dataset.id=r.id;d.innerHTML='<canvas class="img"></canvas><canvas class="hl"></canvas>';renderCrop(d);return d}
async function renderCrop(el){
  const f=findReg(el.dataset.id);if(!f)return;const r=f.r;const bmp=await pageBitmap(r.page);
  const sx=r.x*bmp.width,sy=r.y*bmp.height,sw=Math.max(1,r.w*bmp.width),sh=Math.max(1,r.h*bmp.height);
  const img=el.querySelector(".img"),hl=el.querySelector(".hl");img.width=hl.width=Math.round(sw);img.height=hl.height=Math.round(sh);
  img.getContext("2d").drawImage(bmp,sx,sy,sw,sh,0,0,img.width,img.height);drawMarks(hl,r);
}
function drawMarks(cv,r,list){
  const c=cv.getContext("2d");c.clearRect(0,0,cv.width,cv.height);const sx=cv.width/r.w,sy=cv.height/r.h;
  for(const s of list||S.data.marks[r.id]||[]){c.save();c.lineCap="round";c.lineJoin="round";c.strokeStyle=COLORS[s.c]||COLORS.yellow;c.globalAlpha=s.t==="pen"?1:.42;c.lineWidth=Math.max(1,s.w*sx);
    c.beginPath();s.pts.forEach(([x,y],i)=>{const X=(x-r.x)*sx,Y=(y-r.y)*sy;i?c.lineTo(X,Y):c.moveTo(X,Y)});if(s.pts.length===1){const[x,y]=s.pts[0];c.lineTo((x-r.x)*sx+.1,(y-r.y)*sy)}c.stroke();c.restore()}
}

function layoutPanes(){
  const narrow=matchMedia("(max-width:640px)").matches,mode=narrow?"width":S.rfit,gap=6;
  rlist.querySelectorAll(".fit").forEach(fit=>{const crops=[...fit.querySelectorAll(".crop")];if(!crops.length)return;const cs=getComputedStyle(fit);
    const W=fit.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-2;const extra=fit.querySelectorAll(".brk").length*14;
    const H=fit.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-gap*(crops.length-1)-extra-2;
    const dims=crops.map(c=>{const r=findReg(c.dataset.id).r,pg=S.pages[r.page-1];return[r.w*pg.w,r.h*pg.h]});

function cropImage(r,ptW,q,marks){
  return pageBitmap(r.page).then(bmp=>{const sx=r.x*bmp.width,sy=r.y*bmp.height,sw=Math.max(1,r.w*bmp.width),sh=Math.max(1,r.h*bmp.height);

const textCache=new Map();
async function itemsOfPage(pg){const vp=pg.getViewport({scale:1});const tc=await pg.getTextContent();
  // pdf.js only gives internal font ids (g_d8_f4); load the page's fonts once to learn real names like "SegoeUI-Bold"
  const fn=new Map();try{await pg.getOperatorList();for(const id of new Set(tc.items.map(it=>it.fontName))){try{if(pg.commonObjs.has(id)){const o=pg.commonObjs.get(id);fn.set(id,(o.name||id)+(o.bold&&!/bold/i.test(o.name||"")?"-Bold":"")+(o.black&&!/black/i.test(o.name||"")?"-Black":"")+(o.italic&&!/italic|oblique/i.test(o.name||"")?"-Italic":""))}}catch(e){}}}catch(e){}
  return tc.items.filter(it=>it.str&&it.str.trim()).map(it=>{const tx=pdfjsLib.Util.transform(vp.transform,it.transform);const fh=Math.hypot(tx[2],tx[3])||Math.abs(it.height)||8;
    return{s:it.str,f:fn.get(it.fontName)||it.fontName,x:tx[4]/vp.width,y:(tx[5]-fh*.85)/vp.height,w:Math.abs(it.width||0)/vp.width,h:fh/vp.height}})}
function pageText(n){if(!textCache.has(n)){if(!S.pages[n-1])return Promise.reject(closedErr());const pr=itemsOfPage(S.pages[n-1].pg).catch(()=>[]);textCache.set(n,pr)}return textCache.get(n)}
function regionText(items,r){const ins=items.filter(it=>{const cx=it.x+it.w/2,cy=it.y+it.h/2;return cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h});
  ins.sort((a,b)=>Math.abs(a.y-b.y)<Math.min(a.h,b.h)*.5?a.x-b.x:a.y-b.y);return ins.map(i=>i.s).join(" ").replace(/\s+/g," ").trim()}
async function buildTextIndex(getItems,data){const out={};const cache=new Map();const get=n=>{if(!cache.has(n))cache.set(n,getItems(n));return cache.get(n)};
  for(const p of data.pairs){const q=[],a=[];for(const r of p.q)q.push(regionText(await get(r.page),r));for(const r of p.a)a.push(regionText(await get(r.page),r));out[p.id]={q:q.join(" "),a:a.join(" ")}}
  return{pairs:out,updated:Date.now()}}

function labelsFor(data){const cs=(data.chapters||[]).slice().sort((a,b)=>a.start-b.start);const chOf=pg=>{let c=null;for(const ch of cs)if(ch.start<=pg)c=ch;return c};

  const s=Math.max(0,i-50),e=Math.min(text.length,i+90);let out=esc((s?"…":"")+text.slice(s,e)+(e<text.length?"…":""));
  for(const w of words){if(!w)continue;out=out.replace(new RegExp("("+esc(w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>")}return out}

      const hay=(t.q+" "+t.a+" "+note+" "+tags).toLowerCase();if(!words.every(w=>hay.includes(w)))continue;

/* ================= snap to content ================= */
function snapOn(c,r){
  const W=c.width,H=c.height;let x0=Math.max(0,Math.floor(r.x*W)),y0=Math.max(0,Math.floor(r.y*H)),x1=Math.min(W,Math.ceil((r.x+r.w)*W)),y1=Math.min(H,Math.ceil((r.y+r.h)*H));
  const w=x1-x0,h=y1-y0;if(w<6||h<6)return null;let d;try{d=c.getContext("2d",{willReadFrequently:true}).getImageData(x0,y0,w,h).data}catch(e){return null}
  const rows=new Uint32Array(h),cols=new Uint32Array(w);
  for(let y=0;y<h;y++){let o=y*w*4;for(let x=0;x<w;x++,o+=4){if(d[o+3]>40&&(d[o]*3+d[o+1]*6+d[o+2])<2000){rows[y]++;cols[x]++}}}
  const minR=Math.max(1,Math.round(w*.002)),minC=1;let t=0,b=h-1,l=0,rr=w-1;
  while(t<h&&rows[t]<minR)t++;while(b>t&&rows[b]<minR)b--;while(l<w&&cols[l]<minC)l++;while(rr>l&&cols[rr]<minC)rr--;
  if(t>=h||l>=w)return null;const pad=Math.round(Math.min(W,H)*.006);
  const nx=Math.max(x0,x0+l-pad),ny=Math.max(y0,y0+t-pad),nx1=Math.min(x1,x0+rr+1+pad),ny1=Math.min(y1,y0+b+1+pad);
  const out={x:r4(nx/W),y:r4(ny/H),w:r4((nx1-nx)/W),h:r4((ny1-ny)/H)};
  if(Math.abs(out.x-r.x)+Math.abs(out.y-r.y)+Math.abs(out.w-r.w)+Math.abs(out.h-r.h)<.003)return null;return out;
}

/* ================= auto-detect ================= */
function toLines(items){
  const its=items.slice().sort((a,b)=>(a.y+a.h/2)-(b.y+b.h/2)||a.x-b.x);const lines=[];
  for(const it of its){const cy=it.y+it.h/2;let ln=null;for(let k=lines.length-1;k>=Math.max(0,lines.length-4);k--){const l=lines[k];if(Math.abs(l.cy-cy)<Math.max(l.h,it.h)*.55){ln=l;break}}
    if(!ln){ln={items:[],cy,h:it.h,y0:it.y,y1:it.y+it.h,x0:it.x,x1:it.x+it.w};lines.push(ln)}
    ln.items.push(it);ln.y0=Math.min(ln.y0,it.y);ln.y1=Math.max(ln.y1,it.y+it.h);ln.x0=Math.min(ln.x0,it.x);ln.x1=Math.max(ln.x1,it.x+it.w);ln.h=Math.max(ln.h,it.h)}
  for(const l of lines){l.items.sort((a,b)=>a.x-b.x);let s="",px=null;for(const it of l.items){s+=(px!=null&&it.x-px>.004?" ":"")+it.s;px=it.x+it.w}l.text=s.replace(/\s+/g," ").trim()}
  return lines.sort((a,b)=>a.y0-b.y0);
}
const pct=(arr,p)=>{if(!arr.length)return 0;const s=arr.slice().sort((a,b)=>a-b);return s[Math.min(s.length-1,Math.floor(p*(s.length-1)))]};
const QRE1=/^\s*(?:Q|Que|Ques|Question)\s*\.?\s*(?:No\.?\s*)?(\d{1,3})\b\s*[.):\-]?/i;
const QRE2=/^\s*\(?(\d{1,3})\s*[.)]\s*\S/;
const ARE=/^\s*(Ans(?:wer)?|Sol(?:ution)?|Soln)\s*(\.)?\s*(\d{1,3})?\s*([.):\-])?/i;
const AHEAD=/^\s*(?:answer\s*keys?|answer\s*sheet|(?:answers?|solutions?|hints?)(?:\s*(?:\/|&|and)\s*(?:answers?|solutions?|hints?))?(?:\s+(?:to|for|of)\s+(?:the\s+)?[\w\s&\-]{0,40})?)\s*[:.\-]?\s*$/i;
const QHEAD=/^[A-Z][\w\s&\-]{0,40}?\b(?:questions|problems|exercises|illustrations)\s*[:.\-]?\s*$|^(?:questions?|exercises?)\s*[:.\-]?\s*$/i;

      marks.push({kind:side,parent:num,letter:m[2]||null,page:n,y0:l.y0});LOG.add("p."+n+" "+(side==="q"?"QUESTION ":"ANSWER ")+num+(m[2]?"("+m[2]+")":""));continue}

  const qItems=[],aItems=[],mcqs=[],scens=[];

    if(m.kind==="q"||m.kind==="a"){const parts=span(m.page,m.y0-.003,e.n,e.y,m.kind==="a"?16:8);if(parts.length)(m.kind==="q"?qItems:aItems).push({parent:m.parent,letter:m.letter,parts})}

    const kx0=key&&key.x0!=null?key.x0:key&&key.l.x0,kx1=key&&key.x1!=null?key.x1:key&&key.l.x1;const a=key?[{page:key.page,x:clamp(kx0-.006,0,1),y:clamp(key.l.y0-.004,0,1),w:clamp(kx1+.01,0,1)-clamp(kx0-.006,0,1),h:key.l.y1-key.l.y0+.008}]:[];

function parsePageList(str,N){const out=new Set();const parts=String(str||"").split(/[,;\s]+/).filter(Boolean);if(!parts.length)return[];
  for(const t of parts){const m=/^(\d+)(?:\s*[-–to]+\s*(\d+))?$/i.exec(t);if(!m)return null;const a=+m[1],b=m[2]?+m[2]:a;if(a<1||b<a||b>N)return null;for(let i=a;i<=b;i++)out.add(i)}return[...out].sort((x,y)=>x-y)}
const pageRangeText=a=>{const r=[];for(let i=0;i<a.length;){let j=i;while(j+1<a.length&&a[j+1]===a[j]+1)j++;r.push(j>i?a[i]+"–"+a[j]:""+a[i]);i=j+1}return r.join(", ")};
function remapPagesData(data,del,N){const gone=new Set(del),map={};let k=0;for(let p=1;p<=N;p++)if(!gone.has(p))map[p]=++k;
  const nextKept=p=>{for(let q=p;q<=N;q++)if(map[q])return map[q];return 0};
  const d=JSON.parse(JSON.stringify(data||{pairs:[],marks:{}}));d.marks=d.marks||{};let removedQ=0,touchedQ=0;const keep=[];
  for(const pr of d.pairs||[]){let hit=false;for(const side of["q","a"]){const rs=[];for(const r of pr[side]||[]){if(map[r.page]){r.page=map[r.page];rs.push(r)}else{hit=true;delete d.marks[r.id]}}pr[side]=rs}
    if(!pr.q.length){removedQ++;pr.a.forEach(r=>delete d.marks[r.id]);continue}if(hit)touchedQ++;keep.push(pr)}
  d.pairs=keep;let chGone=0;if(d.chapters){d.chapters=d.chapters.filter(c=>{const n=nextKept(c.start);if(!n){chGone++;return false}c.start=n;return true});
    const seen=new Set();d.chapters=d.chapters.filter(c=>seen.has(c.start)?(chGone++,false):(seen.add(c.start),true))}
  return{data:d,map,removedQ,touchedQ,chGone,newN:k}}

    '<label class="kwf"><span>Pages to delete</span><input id="dpIn" value="'+S.cur+'" placeholder="e.g. 1-3, 35" autocomplete="off" inputmode="text"></label>'+

const AB={dir:null,last:null,busy:false,paused:false,every:3*3600e3,file:"PaperPair auto backup.zip",prev:"PaperPair auto backup (previous).zip"};
function abTime(t){return t?new Date(t).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):""}
async function abLoad(){try{const d=await DB.get("kv","autobkDir");if(!AB.dir)AB.dir=d||null;const l=await DB.get("kv","autobkLast");if(!AB.last)AB.last=l||null}catch(_){}
  if(AB.dir)try{AB.paused=(await AB.dir.queryPermission({mode:"readwrite"}))!=="granted"}catch(_){AB.paused=true}navBkHint()}
async function marksManifest(){const docs=(await DB.entries("docs")).map(e=>e[1]).filter(Boolean),marks=await DB.entries("marks");
  const mf={app:"PaperPair",version:4,kind:"marks",created:Date.now(),folders:(await DB.get("kv","folders"))||[],sources:(await DB.get("kv","sources"))||{},topicList:(await DB.get("kv","topicList"))||{},plans:(await DB.get("kv","plans"))||{},seen:(await DB.get("kv","seen"))||{},recipes:(await DB.get("kv","recipes"))||[],srs:(await DB.get("kv","srs"))||{},skip:(await DB.get("kv","skip"))||{},exams:(await DB.get("kv","exams"))||null,
    docs:docs.map(d=>{const r={...d,file:null};delete r.thumb;return r}),marks:{}};

// manual: started by a click (may ask for folder permission); otherwise only runs when permission is already there
async function autoBackupRun(manual){if(AB.busy||!AB.dir||!window.JSZip)return false;AB.busy=true;
  try{let perm="denied";try{perm=await AB.dir.queryPermission({mode:"readwrite"})}catch(_){}
    if(perm!=="granted"){if(manual)try{perm=await AB.dir.requestPermission({mode:"readwrite"})}catch(_){}
      if(perm!=="granted"){AB.paused=true;navBkHint();if(manual)toast("Auto backup needs your OK to use the folder “"+AB.dir.name+"”");return false}}
    AB.paused=false;await flushSave();flushPending();
    const {mf,n}=await marksManifest();const zip=new JSZip();zip.file("paperpair.json",JSON.stringify(mf));
    const blob=await zip.generateAsync({type:"blob",compression:"DEFLATE",compressionOptions:{level:6}});
    // safety: if this browser suddenly has far fewer marked questions than the last auto backup, don't overwrite it
    const was=AB.last&&AB.last.n||0;let name=AB.file;
    if(was>=20&&n<was*.5){name="PaperPair auto backup (check "+new Date().toISOString().slice(0,10)+").zip";toast("This browser now has "+n+" marked questions, but your last auto backup had "+was+". The old backup is kept; the new one was saved separately as “"+name+"”.")}
    else{try{const old=await (await AB.dir.getFileHandle(AB.file)).getFile();if(old.size){const w=await (await AB.dir.getFileHandle(AB.prev,{create:true})).createWritable();await w.write(old);await w.close()}}catch(_){}}
    const w=await (await AB.dir.getFileHandle(name,{create:true})).createWritable();await w.write(blob);await w.close();
    if(name===AB.file){AB.last={at:Date.now(),n,size:blob.size};await DB.put("kv","autobkLast",AB.last)}
    navBkHint();if(manual)toast("Backed up "+n+" questions' marks to “"+AB.dir.name+"”");return true}
  catch(e){console.warn("auto backup",e);AB.paused=true;navBkHint();if(manual)toast("Auto backup failed: "+(e.message||e));return false}
  finally{AB.busy=false}}

/* ---- bank: rendering pages from many PDFs ---- */
const BDOC=new Map(),BBMP=new Map();
function bankPdf(key){
  if(BDOC.has(key)){const v=BDOC.get(key);BDOC.delete(key);BDOC.set(key,v);return v}
  const pr=(async()=>{let bytes;const d=L.docs.find(x=>x.key===key);
    if(d){const b=await DB.get("bytes",key);if(!b)throw new Error("missing");bytes=new Uint8Array(b.slice?b.slice(0):b)}
    else{const fl=linkedFileByKey(key);if(!fl)throw new Error("missing");const f=await fl.handle.getFile();bytes=new Uint8Array(await f.arrayBuffer())}
    return{pdf:await pdfjsLib.getDocument({data:bytes}).promise,pages:new Map()}})();
  pr.catch(()=>BDOC.delete(key));BDOC.set(key,pr);
  // keep a few PDFs open; a closed one is never the paper on screen (closing waits a little so a page still drawing can finish)
  const cur=BK.list&&BK.list[BK.rc]&&BK.list[BK.rc].key;
  while(BDOC.size>8){const k=[...BDOC.keys()].find(x=>x!==key&&x!==cur);if(!k)break;const old=BDOC.get(k);BDOC.delete(k);for(const bk of [...BBMP.keys()])if(bk.startsWith(k+"#"))freeBmp(bk);setTimeout(()=>old.then(o=>closePdf(o.pdf)).catch(()=>{}),8000)}
  return pr}
async function bankPage(key,n){const D=await bankPdf(key);if(!D.pages.has(n)){const pg=await D.pdf.getPage(n);const v=pg.getViewport({scale:1});D.pages.set(n,{pg,w:v.width,h:v.height})}return D.pages.get(n)}
// page images for the Question Bank. Phones get a lighter image and fewer kept in memory: big canvases are what made pages stay blank
const LOWMEM=matchMedia("(pointer:coarse)").matches||(navigator.deviceMemory&&navigator.deviceMemory<=4);
function freeBmp(k){const v=BBMP.get(k);BBMP.delete(k);if(v)setTimeout(()=>v.then(c=>{c.width=c.height=0}).catch(()=>{}),3000)}
function bankBitmap(key,n){const k=key+"#"+n;if(BBMP.has(k)){const v=BBMP.get(k);BBMP.delete(k);BBMP.set(k,v);return v}
  const pr=(async()=>{const P=await bankPage(key,n);const sc=LOWMEM?Math.min(2,Math.max(1.4,1500/P.w)):2.6;const vp=P.pg.getViewport({scale:sc});const c=document.createElement("canvas");c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);
    const ctx=c.getContext("2d");if(!ctx)throw new Error("no canvas memory");await P.pg.render({canvasContext:ctx,viewport:vp}).promise;return c})();
  pr.catch(()=>BBMP.delete(k));BBMP.set(k,pr);const cap=LOWMEM?5:10;while(BBMP.size>cap)freeBmp(BBMP.keys().next().value);return pr}
async function bankCrop(it,r){const d=document.createElement("div");d.className="crop";d.dataset.rid=r.id;d.innerHTML='<canvas class="img"></canvas><canvas class="hl"></canvas>';
  const P=await bankPage(it.key,r.page);d.dataset.pw=r.w*P.w;d.dataset.ph=r.h*P.h;
  d.classList.add("loading");
  const draw=bmp=>{if(!bmp.width)throw new Error("freed");const sx=r.x*bmp.width,sy=r.y*bmp.height,sw=Math.max(1,r.w*bmp.width),sh=Math.max(1,r.h*bmp.height);const img=d.querySelector(".img"),hl=d.querySelector(".hl");
    img.width=hl.width=Math.round(sw);img.height=hl.height=Math.round(sh);const g=img.getContext("2d");if(!g)throw new Error("no canvas memory");g.drawImage(bmp,sx,sy,sw,sh,0,0,img.width,img.height);drawMarks(hl,r,it.data.marks[r.id]||[]);d.classList.remove("loading","fail")};
  // one quiet retry (after freeing memory), then a visible "tap to retry" instead of a blank box
  const go=tries=>bankBitmap(it.key,r.page).then(draw).catch(()=>{BBMP.delete(it.key+"#"+r.page);if(tries>0){for(const k of [...BBMP.keys()].slice(0,-2))freeBmp(k);setTimeout(()=>go(tries-1),350)}
    else{d.classList.remove("loading");d.classList.add("fail");if(!d.querySelector(".cfail"))d.insertAdjacentHTML("beforeend",'<button class="cfail" type="button">Page didn’t load · Tap to retry</button>');d.querySelector(".cfail").onclick=ev=>{ev.stopPropagation();d.classList.remove("fail");d.classList.add("loading");go(1)}}});
  go(1);
  return d}
// remember where you were reading in each pane, so resizing (tapping the small side, fit toggle) keeps your place
const RVSCR=new Map();

      const sx=r.x*bmp.width,sy=r.y*bmp.height,sw=Math.max(1,r.w*bmp.width),sh=Math.max(1,r.h*bmp.height);const w=Math.max(1,Math.round(Math.min(sw,x.w*2))),h=Math.max(1,Math.round(w*sh/sw));
      const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(bmp,sx,sy,sw,sh,0,0,w,h);

      x.img=c.toDataURL("image/jpeg",.86);cache.set(key,x.img);gProg("Cutting out box "+(k+1)+" of "+items.length,.1+.8*(k+1)/items.length);if(k%4===3)await frame()}
    gProg("Designing pages…",.95);await frame();
    const subN=fx.sub!=="all"?(BK.items.find(x=>x.sub===fx.sub)||{}).subName:"";const srcN=fx.srcs.size?[...fx.srcs].map(s=>SRC[s]).join(" + "):"";const tpN=[...fx.topics].filter(x=>x!=="__untagged__");
    const chips=[L2.length+(L2.length===1?" question":" questions"),new Set(L2.map(it=>it.key)).size+" papers"];if(srcN)chips.push(srcN);else chips.push("All sources");if(fx.star)chips.push("Important only");if(fx.dup)chips.push("Asked 2+ times");
    const doc=composePDF(rows,{title:(subN?subN+" - ":"")+"Question Bank"+(tpN.length?" - "+tpN.join(", "):""),subtitle:(byTopic?"Grouped by topic":"Grouped by paper")+(atEnd?"   ·   all questions first, answers at the end":"   ·   questions on the left, answers on the right"),chips});
    const blob=doc.output("blob");const tn=[...fx.topics].filter(x=>x!=="__untagged__");

    const fname=(subN2?subN2.replace(/[\\/:*?"<>|]/g,"")+" - ":"")+"Revision pack"+(tn.length?" - "+tn.join(", ").replace(/[\\/:*?"<>|]/g,"").slice(0,60):"")+".pdf";
    await deliver(blob,fname,{msg:(t2,err)=>gProg(t2,1,err),html:h=>{$("#gMsg").innerHTML=h}});
  }catch(e){(e&&e.closed||console.error(e));gProg("Export failed: "+(e.message||e),null,true)}
  finally{gBusy=false;const g=$("#bxGo");if(g)g.disabled=false;const c=$("#gClose");if(c)c.disabled=false}
}

const KB={id:null};
function kbCfg(){if(document.body.classList.contains("study"))return null;
  if(S.view==="bank"&&!$("#bkMain").hidden){
    if(BK.view==="rep")return{root:"#bkMain",sel:".rpgh,.rph1",id:el=>el.matches(".rpgh")?"g"+el.dataset.gi:"i"+((el.querySelector("[data-rq]")||{}).dataset||{}).rq,
      go:(el,e)=>{if(el.matches(".rpgh")){el.click();return}const b=el.querySelector(e.key==="o"||e.key==="O"?".rpgo":".rpview");b&&b.click()}};
    if(BK.view==="list")return{root:"#bkMain",sel:".brw",id:el=>"b"+((el.querySelector("[data-sel]")||{}).dataset||{}).sel,go:el=>{const b=el.querySelector(".bo");b&&b.click()}};
    if(BK.view==="idx")return{root:"#bkMain",sel:"#ixBody tbody tr",id:el=>"x"+((el.querySelector("[data-open]")||{}).dataset||{}).open,go:el=>{const b=el.querySelector(".ixq");b&&b.click()}};
    return null}
  if(S.view==="lib")return{root:"#libMain",sel:".pli,.hits .hit,.pcard",id:el=>el.matches(".pli")?"p"+((el.querySelector("[data-id]")||{}).dataset||{}).id:el.matches(".hit")?"h"+el.dataset.key+"|"+el.dataset.pair:"c"+el.dataset.key,
    go:el=>{if(el.matches(".pli")){const b=el.querySelector(".plgo")||el.querySelector(".plck");b&&b.click();return}if(el.matches(".pcard")){const b=el.querySelector('[data-act="open"]');(b||el).click();return}el.click()}};
  return null}
function kbRows(c){return[...document.querySelectorAll(c.root+" "+c.sel.split(",").join(","+c.root+" "))].filter(el=>el.offsetParent!==null)}
function kbPaint(scroll){const c=kbCfg();document.querySelectorAll(".kbsel").forEach(x=>x.classList.remove("kbsel"));if(!c||!KB.id)return null;
  const el=kbRows(c).find(x=>c.id(x)===KB.id);if(!el)return null;el.classList.add("kbsel");if(scroll)el.scrollIntoView({block:"nearest"});return el}
function kbMove(d){const c=kbCfg();if(!c)return false;const rows=kbRows(c);if(!rows.length)return false;let i=KB.id?rows.findIndex(x=>c.id(x)===KB.id):-1;
  if(i<0){// start from the first row you can see
    const vis=rows.findIndex(x=>{const r=x.getBoundingClientRect();return r.bottom>70&&r.top<innerHeight});i=vis<0?0:vis;if(d<0&&vis>=0){}}
  else i=d===1e9?rows.length-1:d===-1e9?0:Math.max(0,Math.min(rows.length-1,i+d));
  KB.id=c.id(rows[i]);kbPaint(true);return true}
function kbKey(e){const c=kbCfg();if(!c)return false;const k=e.key;
  if(k==="ArrowDown"||k==="j"||k==="J"){e.preventDefault();return kbMove(1)}
  if(k==="ArrowUp"||k==="k"||k==="K"){e.preventDefault();return kbMove(-1)}
  if(k==="Home"&&KB.id){e.preventDefault();return kbMove(-1e9)}if(k==="End"&&KB.id){e.preventDefault();return kbMove(1e9)}
  const el=KB.id&&kbPaint(false);if(!el)return false;
  if(k==="Enter"||((k==="o"||k==="O")&&el.matches(".rph1"))){e.preventDefault();c.go(el,e);return true}
  if(k==="Escape"){KB.id=null;kbPaint(false);return true}
  if(BK.view==="rep"&&S.view==="bank"){const g=el.closest(".rpg"),h=g&&g.querySelector(".rpgh");
    if(k==="ArrowRight"&&el.matches(".rpgh")&&!g.classList.contains("open")){e.preventDefault();h.click();return true}
    if(k==="ArrowLeft"&&g&&g.classList.contains("open")){e.preventDefault();KB.id="g"+h.dataset.gi;h.click();return true}}
  if(k===" "||k==="x"||k==="X"){const cb=el.querySelector(".plck")||el.querySelector('input[type=checkbox][data-sel]');if(cb){e.preventDefault();cb.click();return true}}
  if(k==="s"||k==="S"){const b=el.querySelector("[data-bstar],[data-ximp]");if(b){e.preventDefault();b.click();return true}}
  return false}
// keep the cursor after a list redraws, and move it to whatever row you click
["#bkMain","#libMain"].forEach(s=>{const r=$(s);if(r)new MutationObserver(()=>{if(KB.id)requestAnimationFrame(()=>kbPaint(false))}).observe(r,{childList:true})});
addEventListener("pointerdown",e=>{const c=kbCfg();if(!c)return;const row=e.target.closest(c.sel);if(row&&row.closest(c.root)){KB.id=c.id(row);requestAnimationFrame(()=>kbPaint(false))}},true);
// menus (topic picker, tags): ↑/↓ walk the options, Enter picks
function menuKey(e){const m=$("#menu");if(m.hidden||(e.key!=="ArrowDown"&&e.key!=="ArrowUp"))return false;const its=[...m.querySelectorAll("button.mi:not([disabled]),[data-tp]")].filter(x=>x.offsetParent!==null);if(!its.length)return false;
  e.preventDefault();let i=its.indexOf(document.activeElement);i=i<0?(e.key==="ArrowDown"?0:its.length-1):Math.max(0,Math.min(its.length-1,i+(e.key==="ArrowDown"?1:-1)));its[i].focus();its[i].scrollIntoView({block:"nearest"});return true}
addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(!$("#menu").hidden){closeMenu();return}if(!$("#exModal").hidden){if(!exBusy)$("#exModal").hidden=true;return}if(!$("#gModal").hidden){gmClose();return}}
  if(menuKey(e))return;
  if(e.key==="ArrowDown"&&e.target.matches("#bkQ,#rpQ,#libSearch")&&!e.altKey){const c=kbCfg();if(c&&kbRows(c).length){e.preventDefault();e.target.blur();KB.id=null;kbMove(1);return}}
  if(e.target.matches("input:not([type=checkbox]):not([type=radio]),select,textarea"))return;
  if(!$("#menu").hidden&&e.key==="Escape"){closeMenu();return}
  if(!$("#exModal").hidden)return;
  if(!$("#gModal").hidden)return;
  if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&(S.view==="lib"||(S.view==="bank"&&BK.view!=="slides"))&&kbKey(e))return;
  if(S.view==="bank"&&BK.view==="slides"&&(e.ctrlKey||e.metaKey)&&!e.altKey){const kz=e.key.toLowerCase();if(kz==="z"||kz==="y"){e.preventDefault();rvUndo(kz==="y"||(kz==="z"&&e.shiftKey));return}}
  if(S.view==="bank"){if(BK.view!=="slides"||e.ctrlKey||e.metaKey)return;const k2=e.key;
    if(k2==="ArrowDown"||k2==="ArrowUp"){e.preventDefault();const sc=rvScroller();if(sc)sc.scrollBy({top:(k2==="ArrowDown"?1:-1)*Math.max(60,sc.clientHeight*.12),behavior:e.repeat?"auto":"smooth"})}
    else if(k2==="ArrowRight"||k2==="PageDown"){e.preventDefault();bankGo(BK.rc+1)}else if(k2==="ArrowLeft"||k2==="PageUp"){e.preventDefault();bankGo(BK.rc-1)}
    else if(k2===" "){e.preventDefault();const ap=$("#bkMain").querySelector(".ap.hidden");if(ap){BK.revealed=true;if(document.body.classList.contains("study")){BK.qOpen=false;renderBankSlides()}else ap.classList.remove("hidden")}else bankGo(BK.rc+1)}
    else if(k2==="/"){const qi=$("#rvQ");if(qi){e.preventDefault();qi.focus()}}
    else if(k2==="s"||k2==="S"){const b=$("#bkMain").querySelector('[data-act="star"]');if(b)b.click()}
    else if(k2==="l"||k2==="L"){const b=$("#bkMain").querySelector('[data-act="ldr"]');if(b)b.click()}
    else if(k2==="p"||k2==="P"){const b=$("#bkMain").querySelector('.rvq2pdf');if(b){e.preventDefault();b.click()}}
    else if(k2==="Tab"||k2==="q"||k2==="Q"||k2==="a"||k2==="A"){// switch which side is big: Tab swaps, Q = question, A = answer (shows it if hidden)
      const lw=k2.toLowerCase(),want=k2==="Tab"?(BK.split>=.5?"a":"q"):lw;e.preventDefault();
      const go=()=>{const land=$("#bkMain .rv.land");if(land)setSplit(want==="q"?.75:.25,true,true);else{const pn=$("#bkMain .pane."+(want==="q"?"qp":"ap"));if(pn)pn.scrollIntoView({block:"start",behavior:"smooth"})}};
      if(want==="a"&&!BK.revealed){const rb=$("#bkMain").querySelector('[data-act="reveal"]');if(rb){rb.click();requestAnimationFrame(go);return}}go()}
    else if(k2==="m"||k2==="M"){const b=$("#bkMain").querySelector('[data-act="mis"]');if(b)b.click()}
    else if((k2==="v"||k2==="V")&&document.body.classList.contains("study")){const b=$("#bkMain").querySelector('.rvasked[data-act="same"]');if(b){e.preventDefault();b.click()}}else if(k2==="Escape"){if(S.hl)setPen(null);else studyEnd()}
    else{const map={1:"yellow",2:"green",3:"pink",4:"blue",5:"pen",e:"erase"};if(map[k2])setPen(S.hl===map[k2]?null:map[k2])}return}
  if(S.view!=="work")return;
  const k=e.key,mod=e.ctrlKey||e.metaKey;
  if(mod&&k.toLowerCase()==="z"){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&k.toLowerCase()==="y"){e.preventDefault();redo();return}
  if(mod)return;
  if(S.tab==="mark"){
    const kl=k.toLowerCase();
    if(kl==="q")setMode("q");else if(kl==="a")setMode("a");else if(kl==="v")setMode("v");
    else if(kl==="c"){if(activePair()&&S.mode!=="v"){S.extend=!S.extend;updateHint()}}
    else if(kl==="j"){if(!$("#jumpBtn").hidden)$("#jumpBtn").click()}
    else if(kl==="h"){openChForm(null)}
    else if(kl==="w")setFit("width");else if(k==="0")setFit("page");
    else if(k==="Delete"||k==="Backspace"){if(S.sgSel){e.preventDefault();const q=S.sgSel,sg=(S.sugg||[]).find(s=>s.id===q.id);if(sg){sg[q.side].splice(q.j,1);if(!sg.q.length)S.sugg=S.sugg.filter(s=>s!==sg);else S.sgFocus=sg.id}S.sgSel=null;refreshAll()}else if(S.selId){e.preventDefault();deleteSel()}}
    else if(k==="Escape"){S.selId=null;S.extend=false;refreshAll()}
    else if(k.startsWith("Arrow")&&S.selId&&S.selClick===S.selId){e.preventDefault();const s=e.shiftKey?10:1;nudge(k==="ArrowLeft"?-s:k==="ArrowRight"?s:0,k==="ArrowUp"?-s:k==="ArrowDown"?s:0)}
    else if(k==="ArrowRight"||k==="PageDown"){e.preventDefault();goPage(S.cur+1)}
    else if(k==="ArrowLeft"||k==="PageUp"){e.preventDefault();goPage(S.cur-1)}
    else if(k==="Home"){e.preventDefault();goPage(1)}else if(k==="End"){e.preventDefault();goPage(S.pages.length)}
    else if(k==="+"||k==="=")setZoom(S.zoom*1.2);else if(k==="-")setZoom(S.zoom/1.2);
  }else{
    if(k==="Escape")setPen(null);
    else if(k==="ArrowRight"||k==="ArrowDown"||k==="PageDown"){e.preventDefault();go(S.rc+1)}
    else if(k==="ArrowLeft"||k==="ArrowUp"||k==="PageUp"){e.preventDefault();go(S.rc-1)}

    else{const map={1:"yellow",2:"green",3:"pink",4:"blue",5:"pen",e:"erase"};if(map[k])setPen(S.hl===map[k]?null:map[k])}
  }
});

    else if(st.v==="lib"){renderLibrary()}
